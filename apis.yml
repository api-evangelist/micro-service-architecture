aid: micro-service-architecture
name: Micro-service Architecture
description: >-
  An architectural style that structures an application as a collection of
  loosely coupled, independently deployable services, each running in its own
  process and communicating through lightweight mechanisms like HTTP APIs.
  Modern development teams rely on it to improve code quality and delivery speed.
